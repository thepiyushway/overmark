name: Test, build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (a '-' suffix such as -beta.1 marks it a pre-release)"
        required: true
        default: "v1.0.0-beta.1"

permissions:
  contents: write

jobs:
  test:
    name: Smoke test (web app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: python tests/smoke_test.py
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: End-to-end test of the standalone app (Electron, 33 steps)
        working-directory: desktop
        run: |
          sudo apt-get install -y xvfb >/dev/null
          npm install --no-audit --no-fund
          xvfb-run -a -s "-screen 0 1440x900x24" npm test

  build:
    name: Build macOS app
    needs: test
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        working-directory: desktop
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="$(node -p "require('./package.json').version")"
          [ "${TAG#v}" = "$VER" ] || { echo "Tag $TAG doesn't match desktop/package.json version $VER. Bump the version first."; exit 1; }
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build DMG and zip (Apple Silicon + Intel)
        working-directory: desktop
        run: npm run dist || (sleep 10 && npm run dist)
      - name: Verify the packaged app
        working-directory: desktop/dist
        run: |
          set -e
          ls -la
          for app in mac-arm64/Overmark.app mac/Overmark.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier"
            /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$app/Contents/Info.plist" | grep -q true
            test -f "$app/Contents/Resources/app.asar"
          done
          # Launch the Apple Silicon build and make sure it stays up
          mac-arm64/Overmark.app/Contents/MacOS/Overmark > launch.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 $PID 2>/dev/null; then echo "Overmark is running after 20 s"; kill $PID; else echo "Overmark exited early"; cat launch.log; exit 1; fi
          for f in *.dmg; do hdiutil verify "$f"; done
          shasum -a 256 *.dmg *.zip | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: overmark-mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Overmark ${{ github.event.inputs.tag || github.ref_name }}
          body_path: .github/release-notes.md
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          make_latest: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/SHA256SUMS.txt
