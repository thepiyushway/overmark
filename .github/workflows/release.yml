name: Release

# main is where work happens. Pushing to the `release` branch ships it:
#   1. all tests run (the same Tests workflow as main);
#   2. if desktop/package.json has a version that hasn't been released yet, the macOS app is built,
#      checked, and published as a GitHub Release with that version;
#   3. everyone running Overmark sees the update: a notification, a banner in Settings,
#      a notice on screen, and "Install update" in the menu bar.
# Pushing to release without bumping the version runs the tests and publishes nothing.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  version:
    name: Is this a new version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: v
        run: |
          VERSION="$(node -p "require('./desktop/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is already released. Bump \"version\" in desktop/package.json (and add a CHANGELOG entry) to publish an update."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            grep -q "^## $VERSION" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $VERSION' section. Add release notes for this version."; exit 1; }
          fi

  build:
    name: Build, check and publish the macOS app
    needs: [tests, version]
    if: needs.version.outputs.publish == 'true'
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20" }
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build DMG and zip (Apple Silicon + Intel)
        working-directory: desktop
        run: npm run dist || (sleep 10 && npm run dist)
      - name: Verify the packaged apps
        working-directory: desktop/dist
        run: |
          set -e
          ls -la
          for app in mac-arm64/Overmark.app mac/Overmark.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$app/Contents/Info.plist" | grep -q true
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          done
          mac-arm64/Overmark.app/Contents/MacOS/Overmark > launch.log 2>&1 &
          PID=$!; sleep 20
          if kill -0 $PID 2>/dev/null; then echo "Overmark is running after 20 s"; kill $PID; else echo "Overmark exited early"; cat launch.log; exit 1; fi
          for f in *.dmg; do hdiutil verify "$f"; done
          shasum -a 256 *.dmg *.zip | tee SHA256SUMS.txt
      - name: Release notes (CHANGELOG section + install steps)
        run: |
          awk -v v="## $VERSION" '$0 ~ "^## " { if (found) exit; if (index($0, v) == 1) { found = 1; next } } found' CHANGELOG.md > notes.md
          printf '\n---\n' >> notes.md
          cat .github/release-notes.md >> notes.md
          cat notes.md
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Overmark ${{ env.VERSION }}
          body_path: notes.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.prerelease != 'true' }}
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/SHA256SUMS.txt
